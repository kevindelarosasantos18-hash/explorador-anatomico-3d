<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
html,body{margin:0;height:100%;background:#333;font-family:monospace;}
#info{position:fixed;top:0;left:0;background:rgba(0,0,0,0.8);color:#0f0;padding:8px;font-size:14px;z-index:10;white-space:pre;max-height:90vh;overflow:auto;}
</style>
</head>
<body>
<div id="info">loading...</div>
<script type="importmap">
{"imports": {"three": "https://unpkg.com/three@0.169.0/build/three.module.js",
"three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x333333);
const camera = new THREE.PerspectiveCamera(50, 800/450, 0.001, 1000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(800, 450);
document.body.appendChild(renderer.domElement);
const controls = new OrbitControls(camera, renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff, 2.0));
const dl = new THREE.DirectionalLight(0xffffff, 1.5);
dl.position.set(1,1,1);
scene.add(dl);
const dl2 = new THREE.DirectionalLight(0xffffff, 0.8);
dl2.position.set(-1,0.5,-1);
scene.add(dl2);

const params = new URLSearchParams(location.search);
const url = params.get('model') || 'models/male/skeleton.glb';
const filterStr = params.get('filter') || '';
window.pieces = {};
let modelRoot = null;

const dracoLoader = new DRACOLoader();
dracoLoader.setDecoderPath('draco/');
const loader = new GLTFLoader();
loader.setDRACOLoader(dracoLoader);
window.__scene = scene;

// Normaliza una capa igual que la app (glbBodyLoader.computeStretchFit):
// altura a TARGET_HEIGHT, pies a TARGET_FEET_Y, centrada en X/Z. Sin esto,
// dos capas de fuentes distintas (mm vs metros) no se pueden superponer.
function stretchFit(root) {
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const s = (6.6 - 0.02) / size.y;
  root.scale.multiplyScalar(s);
  root.position.set(-center.x * s, 0.02 - box.min.y * s, -center.z * s);
}

const url2 = params.get('model2');
if (url2) {
  loader.load(url2, (g2) => {
    const g = new THREE.Group();
    const solid2 = params.get('solid2') === '1';
    g2.scene.traverse(o => { if (o.isMesh) o.material = solid2
      ? new THREE.MeshStandardMaterial({ color: 0xe8ddc0, roughness: 0.75, side: THREE.DoubleSide })
      : new THREE.MeshStandardMaterial({ color: 0x44aaff, transparent: true, opacity: 0.35, side: THREE.DoubleSide }); });
    g.add(g2.scene);
    if (params.get('nofit') !== '1') stretchFit(g);
    // Replica el `inset` que la app aplica al esqueleto: lo encoge dentro del
    // cuerpo para que no comparta el punto mas alto con la capa exterior.
    const ins = parseFloat(params.get('inset2') || '0');
    if (ins) {
      const b = new THREE.Box3().setFromObject(g);
      const h = b.max.y - b.min.y;
      const k = (h - 2 * ins) / h;
      const c = b.getCenter(new THREE.Vector3());
      g.scale.multiplyScalar(k);
      g.position.set(g.position.x - c.x * (k - 1), g.position.y - c.y * (k - 1), g.position.z - c.z * (k - 1));
    }
    scene.add(g);
    window.__layer2 = g;
  });
}

loader.load(url, (gltf) => {
  window.__gltf = gltf;
  const allMeshes = [];
  gltf.scene.traverse(o => { if (o.isMesh) allMeshes.push(o); });
  const filters = filterStr.split(',').filter(Boolean);
  // El filtro solo oculta: la normalización debe calcularse siempre con el
  // modelo completo, o una vista filtrada se escalaría a pantalla completa.
  const shown = allMeshes;
  if (filters.length) allMeshes.forEach(o => { o.visible = filters.some(f => o.name.includes(f)); });
  modelRoot = new THREE.Group();
  const colorize = params.get('colorize') === '1';
  shown.forEach((o, i) => {
    window.pieces[o.name] = o;
    if (colorize) {
      o.material = new THREE.MeshStandardMaterial({
        color: new THREE.Color().setHSL((i * 0.39) % 1, 0.75, 0.55),
        roughness: 0.6, metalness: 0.0, side: THREE.DoubleSide
      });
    }
    modelRoot.add(o);
  });
  scene.add(modelRoot);
  if (url2 && params.get('nofit') !== '1') stretchFit(modelRoot);

  const box = new THREE.Box3().setFromObject(modelRoot);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3()).length();
  controls.target.copy(center);
  camera.position.copy(center).add(new THREE.Vector3(size*0.7, size*0.4, size*0.7));
  camera.near = Math.max(size/1000,0.0001); camera.far = size*10;
  camera.updateProjectionMatrix();
  controls.update();
  window.__setView = (dir) => {
    const d = {front:[0,0,1], back:[0,0,-1], left:[-1,0,0], right:[1,0,0], top:[0,1,0.001], bottom:[0,-1,0.001]}[dir] || [0.7,0.4,0.7];
    camera.position.copy(center).add(new THREE.Vector3(...d).normalize().multiplyScalar(size*1.6));
    controls.target.copy(center); controls.update();
  };
  window.__at = (tx, ty, tz, deg, elev, dist) => {
    const a = deg * Math.PI / 180, e = (elev || 0) * Math.PI / 180;
    const d = new THREE.Vector3(Math.sin(a) * Math.cos(e), Math.sin(e), Math.cos(a) * Math.cos(e));
    const t = new THREE.Vector3(tx, ty, tz);
    camera.position.copy(t).add(d.multiplyScalar(dist));
    camera.near = 0.0005; camera.far = 100; camera.updateProjectionMatrix();
    controls.target.copy(t); controls.update();
  };
  window.__az = (deg, elev) => {
    const a = deg * Math.PI / 180, e = (elev || 0) * Math.PI / 180;
    const d = new THREE.Vector3(Math.sin(a) * Math.cos(e), Math.sin(e), Math.cos(a) * Math.cos(e));
    camera.position.copy(center).add(d.multiplyScalar(size * 1.55));
    controls.target.copy(center); controls.update();
  };
  window.__look = (ty, dir, dist) => {
    const d = {front:[0,0,1], back:[0,0,-1], left:[-1,0,0], right:[1,0,0], top:[0,1,0.001], bottom:[0,-1,0.001]}[dir] || [0.7,0.4,0.7];
    const t = new THREE.Vector3(0, ty, 0);
    camera.position.copy(t).add(new THREE.Vector3(...d).normalize().multiplyScalar(dist));
    camera.near = 0.001; camera.far = 100; camera.updateProjectionMatrix();
    controls.target.copy(t); controls.update();
  };
  window.__explode = (k) => {
    shown.forEach(o => {
      if (!o.userData.home) o.userData.home = o.position.clone();
      const b = new THREE.Box3().setFromObject(o);
      if (!o.userData.dir) o.userData.dir = b.getCenter(new THREE.Vector3()).sub(center).normalize();
      o.position.copy(o.userData.home).add(o.userData.dir.clone().multiplyScalar(size*k));
    });
  };
  const v = params.get('view'); if (v) window.__setView(v);
  const ex = parseFloat(params.get('explode')); if (ex) window.__explode(ex);
  document.title = 'loaded: ' + url;
  document.getElementById('info').textContent = shown.length + '/' + allMeshes.length + ' pieces shown. Click one.\nfilter=' + filterStr;
}, undefined, (err) => {
  document.body.innerHTML = '<pre style="color:red">ERROR: ' + err + '</pre>';
});

const raycaster = new THREE.Raycaster();
renderer.domElement.addEventListener('pointerdown', (e) => {
  const rect = renderer.domElement.getBoundingClientRect();
  const ndc = new THREE.Vector2(
    ((e.clientX-rect.left)/rect.width)*2-1,
    -((e.clientY-rect.top)/rect.height)*2+1
  );
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(modelRoot ? modelRoot.children : [], true);
  if (hits.length) {
    const obj = hits[0].object;
    const p = hits[0].point;
    document.getElementById('info').textContent = 'name: ' + obj.name + '\nhit point: ' + p.x.toFixed(4)+','+p.y.toFixed(4)+','+p.z.toFixed(4);
    document.title = 'PICKED: ' + obj.name;
  }
});

function resize(){
  const w = window.innerWidth || document.documentElement.clientWidth || 800;
  const h = window.innerHeight || document.documentElement.clientHeight || 450;
  renderer.setSize(w, h);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
setTimeout(resize, 50);
setTimeout(resize, 300);

function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
animate();
</script>
</body>
</html>
